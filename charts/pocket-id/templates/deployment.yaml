apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  labels:
    app: pocket-id
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: pocket-id
  template:
    metadata:
      labels:
        app: pocket-id
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: pocket-id
        image: ghcr.io/pocket-id/pocket-id:v2
        imagePullPolicy: {{ .Values.deployment.imagePullPolicy }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        ports:
        - name: web
          containerPort: 1411
          protocol: TCP
        env:
        - name: TRUST_PROXY
          value: "true"
        - name: APP_URL
          value: https://{{ .Values.ingressRoute.host }}
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- with .Values.envFrom }}
        envFrom:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          exec:
            command:
            - /app/pocket-id
            - healthcheck
          initialDelaySeconds: 10
          periodSeconds: 90
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        emptyDir: {}
