controller:
  type: daemonset

alloy:
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  configMap:
    content: |
      ${config}

rbac:
  clusterRules:
    - apiGroups: [""]
      resources: ["nodes", "nodes/pods", "nodes/metrics", "nodes/proxy"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
