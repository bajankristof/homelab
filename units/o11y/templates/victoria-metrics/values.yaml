nameOverride: ${name_override}

server:
  fullnameOverride: ${name_override}
  retentionPeriod: ${retention_days}

  persistentVolume:
    enabled: true
    existingClaim: ${volume_claim}

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 2000

  podSecurityContext:
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
