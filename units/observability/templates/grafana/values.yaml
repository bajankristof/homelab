admin:
  existingSecret: ${env_secret}
  userKey: GF_SECURITY_ADMIN_USER
  passwordKey: GF_SECURITY_ADMIN_PASSWORD

persistence:
  enabled: true
  existingClaim: ${volume_claim}

service:
  port: 80

goMemLimit:
  enabled: true
  factor: 0.8

plugins:
  - victoriametrics-metrics-datasource
  - victoriametrics-logs-datasource

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: ${victoria_metrics_url}
        isDefault: true
        jsonData:
          prometheusType: Prometheus
          timeInterval: 30s
      - name: VictoriaMetrics
        type: victoriametrics-metrics-datasource
        access: proxy
        url: ${victoria_metrics_url}
        isDefault: false
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: ${victoria_logs_url}

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    node-exporter-full:
      gnetId: 1860
      revision: 45
      datasource: Prometheus
    kubernetes-views-global:
      gnetId: 15757
      revision: 39
      datasource: Prometheus
    kubernetes-views-nodes:
      gnetId: 15759
      revision: 40
      datasource: Prometheus
    kubernetes-views-pods:
      gnetId: 15760
      revision: 39
      datasource: Prometheus
    traefik-official-kubernetes:
      gnetId: 17347
      revision: 9
      datasource: Prometheus

envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: ${env_secret}
      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET

grafana.ini:
  server:
    root_url: ${base_url}/
  auth:
    oauth_allow_insecure_email_lookup: true
  auth.generic_oauth:
    enabled: true
    name: Pocket ID
    client_id: ${oidc_client_id}
    scopes: openid profile email groups
    auth_url: ${oidc_auth_url}
    token_url: ${oidc_token_url}
    api_url: ${oidc_userinfo_url}
    email_attribute_name: email:primary
    allow_sign_up: true
    allow_assign_grafana_admin: true
    role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
  analytics:
    reporting_enabled: false
  news:
    news_feed_enabled: false
  smtp:
    enabled: true
    host: ${smtp_host}:${smtp_port}
    from_address: ${smtp_from_address}
    from_name: Grafana
    skip_verify: false

smtp:
  existingSecret: ${env_secret}
  userKey: GF_SMTP_USER
  passwordKey: GF_SMTP_PASSWORD

extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: grafana
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`${hostname}`)
          services:
            - kind: Service
              name: grafana
              port: 80
      tls:
        certResolver: letsencrypt
        domains:
          - main: ${hostname}
