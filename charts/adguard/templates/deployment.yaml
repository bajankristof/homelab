apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  labels:
    app: adguard
spec:
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      containers:
      - name: adguard
        image: adguard/adguardhome:latest
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        ports:
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        - name: dns-udp
          containerPort: 53
          protocol: UDP
        - name: web
          containerPort: 80
          protocol: TCP
        - name: web-setup
          containerPort: 3000
          protocol: TCP
        volumeMounts:
        - name: adguard-work
          mountPath: /opt/adguardhome/work
        - name: adguard-conf
          mountPath: /opt/adguardhome/conf
        livenessProbe:
          tcpSocket:
            port: dns-tcp
          # We use a long initial delay, because AdGuard Home does not open
          # the DNS port until after the initial setup is complete.
          initialDelaySeconds: 300
          periodSeconds: 10
      volumes:
      - name: adguard-work
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.work.name | default (printf "%s-work" .Release.Name) }}
      - name: adguard-conf
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.conf.name | default (printf "%s-conf" .Release.Name) }}
