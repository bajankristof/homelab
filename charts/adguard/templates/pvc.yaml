apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.conf.name | default (printf "%s-conf" .Release.Name) }}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.persistence.conf.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.conf.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.work.name | default (printf "%s-work" .Release.Name) }}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.persistence.work.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.work.size }}
