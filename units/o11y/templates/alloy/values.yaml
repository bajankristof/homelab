controller:
  type: daemonset

  volumes:
    extra:
      - name: host-proc
        hostPath:
          path: /proc
          type: ""
      - name: host-sys
        hostPath:
          path: /sys
          type: ""
      - name: host-rootfs
        hostPath:
          path: /
          type: ""

alloy:
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  mounts:
    extra:
      - name: host-proc
        mountPath: /host/proc
        readOnly: true
        mountPropagation: HostToContainer
      - name: host-sys
        mountPath: /host/sys
        readOnly: true
        mountPropagation: HostToContainer
      - name: host-rootfs
        mountPath: /host/rootfs
        readOnly: true
        mountPropagation: HostToContainer

  configMap:
    content: |
      ${config}

rbac:
  clusterRules:
    - apiGroups: [""]
      resources: ["nodes", "nodes/pods", "nodes/metrics", "nodes/proxy"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
