apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  labels:
    app: seerr
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:latest
        imagePullPolicy: {{ .Values.deployment.imagePullPolicy }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        ports:
        - name: web
          containerPort: 5055
          protocol: TCP
        env:
        - name: PORT
          value: "5055"
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- with .Values.envFrom }}
        envFrom:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: seerr-data
          mountPath: /app/config
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: web
          initialDelaySeconds: 10
          periodSeconds: 90
      volumes:
      - name: seerr-data
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.name | default .Release.Name }}
